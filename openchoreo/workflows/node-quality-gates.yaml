apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: node-quality-gates
  labels:
    app.kubernetes.io/name: node-quality-gates
    app.kubernetes.io/part-of: hello-api-ci
spec:
  templates:
    - name: validate
      inputs:
        parameters:
          - name: app-path
            default: "."
      container:
        image: node:22-alpine
        command:
          - sh
          - -c
        args:
          - |-
            set -eu

            APP_PATH="{{inputs.parameters.app-path}}"
            SOURCE_PATH="/mnt/vol/source"

            if [ -n "${APP_PATH}" ] && [ "${APP_PATH}" != "." ] && [ "${APP_PATH}" != "/" ]; then
              SOURCE_PATH="${SOURCE_PATH}/${APP_PATH#/}"
            fi

            cd "${SOURCE_PATH}"
            npm ci
            npm run validate:ci
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        volumeMounts:
          - name: workspace
            mountPath: /mnt/vol
