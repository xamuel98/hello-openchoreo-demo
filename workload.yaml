apiVersion: openchoreo.dev/v1alpha1

metadata:
  name: hello-api

endpoints:
  - name: http
    displayName: Hello API
    visibility:
      - external
    port: 8080
    type: HTTP
    basePath: /

dependencies:
  endpoints:
    - component: user-service
      name: http
      visibility: project
      envBindings:
        address: USER_SERVICE_URL
    - component: order-service
      name: http
      visibility: project
      envBindings:
        address: ORDER_SERVICE_URL
    - component: notification-service
      name: http
      visibility: project
      envBindings:
        address: NOTIFICATION_SERVICE_URL

configurations:
  env:
    - name: APP_ENV
      value: development
